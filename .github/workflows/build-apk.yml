name: Build EMBER Native Kotlin APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Validate original EMBER interface
        run: |
          test -s app/src/main/assets/index.html
          grep -q 'id="center"' app/src/main/assets/index.html
          grep -q 'Traseng created by Darth Wolf' app/src/main/assets/index.html
          grep -q 'applyEmberScale' app/src/main/assets/index.html
      - name: Validate synchronized HTML and JavaScript syntax
        run: |
          cmp -s www/index.html app/src/main/assets/index.html
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess, tempfile

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.parts = []
                  self.current = []

              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      attrs = dict(attrs)
                      self.active = True
                      self.current = []
                      self.skip = bool(attrs.get("src")) or attrs.get("type", "").lower() in ("application/json", "application/ld+json")

              def handle_data(self, data):
                  if self.active and not getattr(self, "skip", False):
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag == "script" and self.active:
                      if not getattr(self, "skip", False):
                          self.parts.append("".join(self.current))
                      self.active = False

          parser = Scripts()
          parser.feed(Path("www/index.html").read_text(encoding="utf-8"))
          scripts = [s for s in parser.parts if s.strip()]
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          with tempfile.TemporaryDirectory() as directory:
              for index, script in enumerate(scripts):
                  target = Path(directory) / f"script-{index}.js"
                  target.write_text(script, encoding="utf-8")
                  subprocess.run(["node", "--check", str(target)], check=True)
          print(f"Validated {len(scripts)} inline JavaScript block(s)")
          PY
      - name: Build native Kotlin APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EMBER-Kotlin-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kotlin-build-${{ github.run_number }}
          name: EMBER Kotlin build ${{ github.run_number }}
          body: |
            Native Kotlin Android host with the preserved EMBER interface packaged as an Android asset.
            This is the initial migration milestone. Advanced Android services are not yet implemented.
          files: app/build/outputs/apk/debug/app-debug.apk
