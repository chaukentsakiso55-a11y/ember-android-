name: Build EMBER Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate EMBER HTML interface
        run: |
          test -s www/index.html
          grep -q 'id="center"' www/index.html
          grep -q 'id="inp"' www/index.html
          grep -q 'id="log"' www/index.html

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx cap add android

      - name: Patch Android shell
        run: node scripts/patch-android.js

      - name: Sync web interface
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EMBER-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create GitHub release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: EMBER Android build ${{ github.run_number }}
          body: |
            Automated debug-signed EMBER Android build.
            This release packages the HTML interface in a Capacitor Android shell.
            Desktop-only Python capabilities are documented separately and are not claimed as Android features.
          files: android/app/build/outputs/apk/debug/app-debug.apk
