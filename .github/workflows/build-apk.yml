name: Build EMBER Native Kotlin APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Validate original EMBER interface
        run: |
          test -s app/src/main/assets/index.html
          grep -q 'id="center"' app/src/main/assets/index.html
          grep -q 'Traseng created by Darth Wolf' app/src/main/assets/index.html
          grep -q 'applyEmberScale' app/src/main/assets/index.html
      - name: Build native Kotlin APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EMBER-Kotlin-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kotlin-build-${{ github.run_number }}
          name: EMBER Kotlin build ${{ github.run_number }}
          body: |
            Native Kotlin Android host with the preserved EMBER interface packaged as an Android asset.
            This is the initial migration milestone. Advanced Android services are not yet implemented.
          files: app/build/outputs/apk/debug/app-debug.apk
